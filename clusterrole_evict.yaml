apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: matrix-governor-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - nodes/status
  - pods
  - pods/status
  - pods/eviction
  - namespaces
  - events
  verbs:
  - '*'
- apiGroups:
  - apps
  resources:
  - deployments
  - daemonsets
  - replicasets
  - statefulsets
  verbs:
  - '*'
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  - poddisruptionbudgets/status
  - evictions
  verbs:
  - '*'
