apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: oversoldpolicies.matrix.io
spec:
  group: matrix.io
  names:
    kind: OversoldPolicy
    listKind: OversoldPolicyList
    plural: oversoldpolicies
    singular: oversoldpolicy
    shortNames:
      - osp
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                maxCPURatio:
                  type: number
                  minimum: 1.0
                  maximum: 4.0
                maxMemRatio:
                  type: number
                  minimum: 1.0
                  maximum: 3.0
                targetUtilization:
                  type: number
                  minimum: 0.1
                  maximum: 0.95
                fuseThreshold:
                  type: number
                  minimum: 0.5
                  maximum: 0.99
                resourceModel:
                  type: string
                  enum: ["Allocatable", "Batch", "Dual"]
            status:
              type: object
              properties:
                matchedNodes:
                  type: integer
                currentAvgCPURatio:
                  type: number
                lastReconcileTime:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Max-CPU-Ratio
          type: number
          jsonPath: .spec.maxCPURatio
        - name: Target-Util
          type: number
          jsonPath: .spec.targetUtilization
        - name: Fuse-Threshold
          type: number
          jsonPath: .spec.fuseThreshold
        - name: Resource-Model
          type: string
          jsonPath: .spec.resourceModel
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
