apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workloadqoses.matrix.io
spec:
  group: matrix.io
  names:
    kind: WorkloadQoS
    listKind: WorkloadQoSList
    plural: workloadqoses
    singular: workloadqos
    shortNames:
      - wqos
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                qosClass:
                  type: string
                  enum: ["LSR", "LS", "BE"]
                enableCPUBinding:
                  type: boolean
                rdtCLOS:
                  type: string
                networkPriority:
                  type: integer
            status:
              type: object
              properties:
                activePods:
                  type: integer
                lastAction:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: QoS-Class
          type: string
          jsonPath: .spec.qosClass
        - name: CPU-Binding
          type: boolean
          jsonPath: .spec.enableCPUBinding
        - name: RDT-CLOS
          type: string
          jsonPath: .spec.rdtCLOS
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
